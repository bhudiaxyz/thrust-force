<!doctype html>
<html lang="en" style="background: #05060f">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta
            name="description"
            content="Gravity-and-inertia cave shooter. Tow the pod, crack the reactor, escape the planet."
        />
        <title>Thrust Force</title>
        <meta name="theme-color" content="#05060f" />
        <link rel="manifest" href="manifest.webmanifest" />
        <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Thrust Force" />
        <!-- Link previews (chat apps, social). og:image must be an absolute URL. -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Thrust Force" />
        <meta property="og:title" content="Thrust Force" />
        <meta
            property="og:description"
            content="A gravity-and-inertia cave shooter in neon voxels. Tow the pod, crack the reactor, escape the planet: 100 planets, in your browser."
        />
        <meta property="og:url" content="https://bhudiaxyz.github.io/thrust-force/" />
        <meta property="og:image" content="https://bhudiaxyz.github.io/thrust-force/icons/og-card.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="Thrust Force: a glowing ship emblem and the title in neon" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Thrust Force" />
        <meta name="twitter:description" content="Tow the pod. Crack the reactor. Escape the planet." />
        <meta name="twitter:image" content="https://bhudiaxyz.github.io/thrust-force/icons/og-card.png" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2305060f'/><ellipse cx='16' cy='16' rx='14' ry='5' fill='none' stroke='%2366e0ff' stroke-opacity='.6' transform='rotate(-60 16 16)'/><ellipse cx='16' cy='16' rx='10' ry='3.5' fill='none' stroke='%23ffc85a' stroke-opacity='.6'/><defs><filter id='g' x='-50%25' y='-50%25' width='200%25' height='200%25'><feGaussianBlur stdDeviation='1.3'/></filter></defs><path d='M16 8.5 21.5 21.5 16 18.5 10.5 21.5z' fill='none' stroke='%2366e0ff' stroke-width='3' stroke-linejoin='round' filter='url(%23g)'/><path d='M16 8.5 21.5 21.5 16 18.5 10.5 21.5z' fill='%23142030' stroke='%23d8f6ff' stroke-width='1.6' stroke-linejoin='round'/><circle cx='16' cy='14.2' r='1.3' fill='%23ffffff' filter='url(%23g)'/><circle cx='16' cy='14.2' r='0.9' fill='%23e8fbff'/><circle cx='26' cy='16' r='2.2' fill='%23ffc85a'/></svg>"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="app"></div>

        <div id="hud" hidden>
            <div class="h-row">
                <div><span class="h-label">Score</span><span id="h-score">0</span></div>
                <div class="h-mid"><span id="h-level"></span><span id="h-lives" aria-label="Ships left"></span></div>
                <div class="h-bars">
                    <label
                        >Fuel<span class="bar"><span id="h-fuel"></span></span
                    ></label>
                    <label
                        >Reactor<span class="bar bar--hot"><span id="h-reactor"></span></span
                    ></label>
                </div>
            </div>
            <div id="h-count" aria-live="assertive"></div>
            <div id="h-msg" role="status" aria-live="polite"></div>
        </div>

        <button id="minimap" type="button" aria-label="Minimap: tap to show or hide (N)" hidden>
            <canvas></canvas>
            <svg class="mm-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14 M15 6v14" />
            </svg>
        </button>
        <div id="joy" aria-label="Steering stick: point to aim, push fully to thrust"></div>
        <div id="touch">
            <span class="t-gap"></span>
            <button data-k="shield" aria-label="Shield and tractor beam">◎</button>
            <button data-k="fire" aria-label="Fire">●</button>
            <button data-k="thrust" aria-label="Thrust">▲</button>
            <button id="t-pause" aria-label="Pause">❚❚</button>
        </div>

        <div id="boot">
            <div class="ls-bg"></div>
            <div class="ls-frame">
                <div class="ls-emblem" aria-hidden="true">
                    <div class="ls-orbit"></div>
                    <div class="ls-orbit ls-orbit--inner"></div>
                    <svg class="ls-ship" viewBox="0 0 40 40">
                        <path class="ls-hull" d="M20 4 32 32 20 26 8 32z" />
                        <circle class="ls-canopy" cx="20" cy="17" r="2.2" />
                    </svg>
                    <span class="ls-pod"></span>
                </div>
                <h1 class="ls-title">Thrust<span>Force</span></h1>
                <div class="ls-rule"></div>
                <p class="ls-sub" role="status" aria-live="polite">
                    Tow the pod. Crack the reactor. Escape the planet.
                </p>
                <div class="ls-bar"><span></span></div>
                <p class="ls-tip">Loading&hellip;</p>
                <p class="ls-best"></p>
                <nav class="ls-menu" aria-label="Main menu"></nav>
                <p class="ls-controls"></p>
            </div>
        </div>

        <div id="pause" data-kind="pause">
            <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pause-title">
                <h2 id="pause-title">Paused</h2>
                <p class="p-score"></p>
                <dl class="p-stats"></dl>
                <nav>
                    <button type="button" id="pause-resume"><span>Resume</span><kbd>Esc</kbd></button>
                    <button type="button" id="pause-restart"><span>Restart planet</span><kbd>R</kbd></button>
                    <button type="button" id="pause-share"><span>Share result</span></button>
                    <button type="button" id="pause-mute"><span>Sound</span><kbd>M</kbd></button>
                    <button type="button" id="pause-menu"><span>Main menu</span><kbd>Q</kbd></button>
                </nav>
                <div class="controls">
                    <h3>Controls</h3>
                    <div class="bindings"></div>
                    <p class="p-help">
                        Hold the tractor beam near the pod to tow it, then fly out through the sky. Beam fuel cells to
                        refuel. Each reactor hit stuns the turrets; enough hits and it goes critical: ten seconds to get
                        out.
                    </p>
                </div>
            </div>
        </div>
        <div id="sheet">
            <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
                <h2 id="sheet-title"></h2>
                <div class="sheet-body"></div>
                <nav class="sheet-actions"></nav>
            </div>
        </div>

        <div id="vignette" aria-hidden="true"></div>
        <div id="intro" aria-live="polite">
            <canvas aria-hidden="true"></canvas>
            <div>
                <p id="intro-num"></p>
                <h2 id="intro-name"></h2>
                <ul id="intro-facts"></ul>
            </div>
        </div>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
